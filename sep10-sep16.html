function fmtLink(url){
 if(!url)return'<span class="nd">&mdash;</span>';
 return'<a class="view-link" href="'+url+'" target="_blank" rel="noopener">View <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1h7v7M11 1L4.5 7.5"/></svg></a>';
}
function fmtBrief(url){
 if(!url)return'<span class="nd">&mdash;</span>';
 return'<a class="view-link" href="'+url+'" target="_blank" rel="noopener">Brief <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1h7v7M11 1L4.5 7.5"/></svg></a>';
}
function buildLegend(){
 const t=TABS[curTab];
 let h='';
 h+='<div class="legend-item"><span class="dot dot-g"></span>CPQA &le; $500</div>';
 h+='<div class="legend-item"><span class="dot dot-y"></span>CPQA $500&ndash;$600</div>';
 h+='<div class="legend-item"><span class="dot dot-r"></span>CPQA &gt; $600</div>';
 if(t.isVideo){
  h+='<div class="legend-item"><span class="dot dot-g"></span>Hook/Hold &ge; 20%</div>';
  h+='<div class="legend-item"><span class="dot dot-y"></span>Hook/Hold 15&ndash;20%</div>';
  h+='<div class="legend-item"><span class="dot dot-r"></span>Hook/Hold &lt; 15%</div>';
 }
 h+='<div class="legend-item"><span class="dot dot-gr"></span>No Data</div>';
 document.getElementById('legend').innerHTML=h;
}
function buildTabs(){
 let h='';
 TABS.forEach((t,i)=>{
  const n=(DATA[t.key]||[]).length;
  h+='<div class="tab'+(i===curTab?' active':'')+'" onclick="switchTab('+i+')">'+t.label+' <span class="cnt">('+n+')</span></div>';
 });
 document.getElementById('tabBar').innerHTML=h;
}
function getCols(){
 const t=TABS[curTab];
 if(t.isRaw)return [{key:'cost',label:'Spend',sortable:true},{key:'impressions',label:'Impressions',sortable:true},{key:'clicks',label:'Clicks',sortable:true},{key:'linkClicks',label:'Link clicks',sortable:true}];
 let cols=[
  {key:'idx',label:'#',sortable:false,cls:'col-idx'},
  {key:'name',label:'Name',sortable:true,cls:'col-name'},
  {key:'link',label:'Ad',sortable:false},
  {key:'brief',label:'Brief',sortable:false},
  {key:'cost',label:'Spend',sortable:true},
  {key:'leads',label:'Leads',sortable:true},
  {key:'cpl',label:'CPL',sortable:true,badge:'cpl'},
  {key:'qa',label:'QA',sortable:true},
  {key:'cpqa',label:'CPQA',sortable:true,badge:'cpqa'},
  {key:'mql',label:'MQL',sortable:true},
  {key:'cpmql',label:'CPMQL',sortable:true},
  {key:'sql',label:'SQL',sortable:true},
  {key:'cpsql',label:'CPSQL',sortable:true},
  {key:'cust',label:'Cust',sortable:true},
  {key:'cac',label:'CAC',sortable:true,badge:'cac'}
 ];
 if(t.isVideo){
  cols.push({key:'hookRate',label:'Hook %',sortable:true,badge:'hookRate'});
  cols.push({key:'holdRate',label:'Hold %',sortable:true,badge:'holdRate'});
 }
 cols.push(
  {key:'ctrAll',label:'CTR (all)',sortable:true},
  {key:'ctrLink',label:'CTR (link)',sortable:true},
  {key:'cpm',label:'CPM',sortable:true},
  {key:'impressions',label:'Impr',sortable:true}
 );
 return cols;
}
function renderTable(){
 const t=TABS[curTab];
 document.getElementById('btnWinners').disabled=!!t.isRaw;
 document.getElementById('btnWinners').style.display=t.isRaw?'none':'';
 if(t.isRaw){renderRaw();return;}
 document.getElementById('tabNote').textContent='Includes all Meta spend and matched attributed results. Creatives with conversions and no spend remain listed.';
 const cols=getCols();
 const data=(DATA[t.key]||[]).slice();
 const q=document.getElementById('search').value.toLowerCase();
 let filtered=data.filter(r=>{
  if(q&&!r.name.toLowerCase().includes(q))return false;
  if(filters.spend&&(r.cost==null||r.cost<1500))return false;
  if(filters.winners&&(r.cpqa==null||r.cpqa>500))return false;
  return true;
 });
 filtered = (typeof __cfConditions!=='undefined' && Array.isArray(__cfConditions) && typeof __cfEval==='function') ? filtered.filter(__cfEval) : filtered;
 filtered.sort((a,b)=>{
  let va=a[sortCol],vb=b[sortCol];
  if(va==null&&vb==null)return 0;
  if(va==null)return 1;
  if(vb==null)return -1;
  if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
  return sortAsc?va-vb:vb-va;
 });
 let th='<tr>';
 cols.forEach(c=>{
  const sorted=c.key===sortCol;
  const arr=sorted?(sortAsc?'&#9650;':'&#9660;'):'&#9650;';
  const cls=(c.cls||'')+(sorted?' sorted':'');
  if(c.sortable)th+='<th class="'+cls+'" onclick="doSort(\''+c.key+'\')">'+c.label+'<span class="arr">'+arr+'</span></th>';
  else th+='<th class="'+cls+'">'+c.label+'</th>';
 });
 th+='</tr>';
 document.getElementById('thead').innerHTML=th;
 let tb='';
 // Rollup row for gender tabs
 if(t.isGender && t.rollupKey && DATA[t.rollupKey]){
  const rr=DATA[t.rollupKey];
  tb+='<tr class="rollup-row">';
  cols.forEach(c=>{
   const cls=c.cls||'';
   if(c.key==='idx'){tb+='<td class="'+cls+'">&Sigma;</td>';return;}
   if(c.key==='name'){tb+='<td class="'+cls+'">'+(rr.name||'TOTAL')+'</td>';return;}
   if(c.key==='link'){tb+='<td><span class="nd">&mdash;</span></td>';return;}
   if(c.key==='cost'){tb+='<td>'+fmt$(rr.cost)+'</td>';return;}
   if(c.key==='leads'||c.key==='qa'||c.key==='mql'||c.key==='sql'||c.key==='cust'||c.key==='impressions'){tb+='<td>'+fmtN(rr[c.key])+'</td>';return;}
   if(c.badge){tb+='<td>'+fmtBadge(rr[c.key],c.badge)+'</td>';return;}
   if(c.key==='ctrAll'||c.key==='ctrLink'){tb+='<td>'+fmtP(rr[c.key])+'</td>';return;}
   if(c.key==='cpm'||c.key==='cpmql'||c.key==='cpsql'){tb+='<td>'+fmtD(rr[c.key])+'</td>';return;}
   tb+='<td>'+fmtN(rr[c.key])+'</td>';
  });
  tb+='</tr>';
 }
 filtered.forEach((r,i)=>{
  tb+='<tr>';
  cols.forEach(c=>{
   const cls=c.cls||'';
   if(c.key==='idx'){tb+='<td class="'+cls+'">'+(i+1)+'</td>';return;}
   if(c.key==='name'){tb+='<td class="'+cls+'" title="'+esc(r.name)+'">'+esc(r.name)+(r.cost===0?'<div class="zero-tag">Attributed results · no spend this week</div>':'')+'</td>';return;}
   if(c.key==='link'){tb+='<td>'+fmtLink(r.link)+'</td>';return;}
   if(c.key==='brief'){tb+='<td>'+fmtBrief(r.brief)+'</td>';return;}
   if(c.key==='cost'){tb+='<td>'+fmt$(r.cost)+'</td>';return;}
   if(c.key==='leads'||c.key==='qa'||c.key==='mql'||c.key==='sql'||c.key==='cust'||c.key==='impressions'){tb+='<td>'+fmtN(r[c.key])+'</td>';return;}
   if(c.badge){tb+='<td>'+fmtBadge(r[c.key],c.badge)+'</td>';return;}
   if(c.key==='ctrAll'||c.key==='ctrLink'){tb+='<td>'+fmtP(r[c.key])+'</td>';return;}
   if(c.key==='cpm'||c.key==='cpmql'||c.key==='cpsql'){tb+='<td>'+fmtD(r[c.key])+'</td>';return;}
   tb+='<td>'+fmtN(r[c.key])+'</td>';
  });
  tb+='</tr>';
 });
 document.getElementById('tbody').innerHTML=tb;
 document.getElementById('rowCount').textContent=filtered.length+' of '+data.length+' creatives';
}
function switchTab(i){curTab=i;sortCol=TABS[i].isRaw?'cost':'cpqa';sortAsc=!TABS[i].isRaw;buildTabs();buildLegend();renderTable();}
function doSort(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=(col==='name'||col==='cpqa'||col==='cpl'||col==='cac');}renderTable();}
function toggleFilter(f){filters[f]=!filters[f];document.getElementById(f==='winners'?'btnWinners':'btnSpend').classList.toggle('active');renderTable();}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let rawShowZero=false;
function renderRaw(){
 const q=document.getElementById('search').value.toLowerCase();
 document.getElementById('tabNote').innerHTML='Full Meta ad names; repeated export rows with the same exact name are summed. This tab shows Meta delivery metrics. <label class="raw-toggle"><input type="checkbox" '+(rawShowZero?'checked':'')+' onchange="rawShowZero=this.checked;renderTable()"> Show zero-spend names</label>';
 let data=DATA.adAccount.filter(r=>(rawShowZero||r.cost>0)&&(!q||(r.name+' '+r.variation+' '+r.concept).toLowerCase().includes(q))&&(!filters.spend||r.cost>=1500));
 if(typeof __cfEval==='function')data=data.filter(__cfEval);
 data.sort((a,b)=>{let av=a[sortCol],bv=b[sortCol];if(av==null)return 1;if(bv==null)return -1;return(typeof av==='string'?av.localeCompare(bv):av-bv)*(sortAsc?1:-1)});
 const cols=[['name','Full ad name'],['cost','Spend'],['impressions','Impressions'],['clicks','Clicks'],['linkClicks','Link clicks'],['concept','Concept']];
 document.getElementById('thead').innerHTML='<tr><th>#</th><th>Ad</th>'+cols.map(([k,l])=>'<th onclick="doSort(\''+k+'\')">'+l+'</th>').join('')+'<th>Source rows</th></tr>';
 document.getElementById('tbody').innerHTML=data.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+fmtLink(r.link)+'</td>'+cols.map(([k])=>'<td'+(k==='name'?' class="col-name" style="position:static"':'')+'>'+(k==='cost'?fmt$(r[k]):['name','concept'].includes(k)?esc(r[k])||'—':fmtN(r[k]))+'</td>').join('')+'<td title="'+r.metaRows.join(', ')+'">'+r.metaRows.length+'</td></tr>').join('');
 document.getElementById('rowCount').textContent=data.length+' of '+DATA.adAccount.length+' distinct Meta ad names';
}

document.getElementById('search').addEventListener('input',renderTable);
buildTabs();buildLegend();renderTable();

// ===== Custom filters (AND/OR) =====
var __cfConditions = [];
function __cfGetMetrics(){
  try{
    var cols = getCols();
    // A filterable metric = any keyed column that isn't the name/index column
    // and isn't explicitly non-sortable. Handles both column shapes: dashboards
    // that tag cols with sortable:true/false (TCC/CEO/DH/Quintessa) and those
    // that omit the flag entirely (Case Source uses {key,label,fmt}).
    return cols.filter(function(c){
      return c && c.key && c.key!=='name' && c.key!=='idx' && c.sortable!==false;
    });
  }catch(e){return [];}
}
function addCondition(){
  __cfConditions.push({metric:'',op:'gte',val:null,connector:'AND'});
  var w=document.getElementById('cf-wrap'); if(w) w.classList.remove('collapsed');
  __cfRender();
}
function removeCondition(i){__cfConditions.splice(i,1); __cfRender(); if(window.__cfOrigRender) window.__cfOrigRender();}
function updateCondition(i,field,value){
  if(field==='val') value = (value===''?null:parseFloat(value));
  __cfConditions[i][field]=value;
  __cfUpdateCount();
  if(window.__cfOrigRender) window.__cfOrigRender();
}
function toggleCustomFilter(){var w=document.getElementById('cf-wrap'); if(w) w.classList.toggle('collapsed');}
function __cfUpdateCount(){
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;}).length;
  var b=document.getElementById('cf-count');
  if(!b) return;
  if(active>0){b.textContent=active; b.style.display='inline-block';}
  else{b.style.display='none';}
}
function __cfRender(){
  var cols=__cfGetMetrics();
  var host=document.getElementById('cf-rows');
  if(!host) return;
  if(!__cfConditions.length){host.innerHTML='<div class="cf-empty">No conditions \u2014 click \u201C+ Add condition\u201D to filter by any metric.</div>'; __cfUpdateCount(); return;}
  var html='';
  __cfConditions.forEach(function(c,i){
    html+='<div class="cf-row">';
    if(i===0){html+='<span class="cf-connector" style="background:transparent;border:none;color:#475569;cursor:default;text-align:right">WHERE</span>';}
    else{
      html+='<select class="cf-connector" onchange="updateCondition('+i+',\'connector\',this.value)">';
      html+='<option value="AND"'+(c.connector==='AND'?' selected':'')+'>AND</option>';
      html+='<option value="OR"'+(c.connector==='OR'?' selected':'')+'>OR</option>';
      html+='</select>';
    }
    html+='<select class="cf-select" onchange="updateCondition('+i+',\'metric\',this.value)">';
    html+='<option value="">Metric...</option>';
    cols.forEach(function(col){html+='<option value="'+col.key+'"'+(c.metric===col.key?' selected':'')+'>'+col.label+'</option>';});
    html+='</select>';
    html+='<select class="cf-select cf-op" onchange="updateCondition('+i+',\'op\',this.value)">';
    html+='<option value="gte"'+(c.op==='gte'?' selected':'')+'>\u2265</option>';
    html+='<option value="gt"'+(c.op==='gt'?' selected':'')+'>></option>';
    html+='<option value="lte"'+(c.op==='lte'?' selected':'')+'>\u2264</option>';
    html+='<option value="lt"'+(c.op==='lt'?' selected':'')+'><</option>';
    html+='</select>';
    html+='<input type="number" step="any" class="cf-input" placeholder="value" value="'+(c.val==null?'':c.val)+'" oninput="updateCondition('+i+',\'val\',this.value)">';
    html+='<button class="cf-remove" onclick="removeCondition('+i+')" title="Remove">\u2715</button>';
    html+='</div>';
  });
  host.innerHTML=html;
  __cfUpdateCount();
}
function __cfEval(r){
  if(!__cfConditions.length) return true;
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;});
  if(!active.length) return true;
  var result=null;
  for(var i=0;i<active.length;i++){
    var c=active[i]; var v=r[c.metric]; var ok;
    if(v==null) ok=false;
    else if(c.op==='gte') ok=v>=c.val;
    else if(c.op==='gt')  ok=v>c.val;
    else if(c.op==='lte') ok=v<=c.val;
    else if(c.op==='lt')  ok=v<c.val;
    else ok=false;
    if(result===null) result=ok;
    else if(c.connector==='OR') result=result||ok;
    else result=result&&ok;
  }
  return result===null?true:result;
}

window.__cfOrigRender = (typeof renderTable === 'function') ? renderTable
                       : ((typeof render === 'function') ? render : null);
(function(){
  if(typeof switchTab === 'function'){
    var __cfOrigSwitch = switchTab;
    switchTab = function(){var r = __cfOrigSwitch.apply(this, arguments); __cfRender(); return r;};
  }
  __cfRender();
})();
</script>
